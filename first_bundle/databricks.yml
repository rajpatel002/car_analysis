# This is a Declarative Automation Bundle definition for first_bundle.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: first_bundle
  uuid: 48b9d5f5-c8e7-4d1f-ac60-da2026508809

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-9dae8ca6-27d7.cloud.databricks.com
    variables:
      catalog: car_data
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-9dae8ca6-27d7.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/patel.raj.020403@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/patel.raj.020403@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: car_data
      schema: dev
    permissions:
      - user_name: patel.raj.020403@gmail.com
        level: CAN_MANAGE
